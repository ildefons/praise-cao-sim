<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="plot-title plot-description">
<title id="plot-title">B1 mean terminal simple regret versus evaluation budget: five decision policies and 95 percent bootstrap intervals</title>
<desc id="plot-description">Five curves for Random, Balanced, Informed, Budget-aware Top2, Knowledge Gradient at budgets 10, 15, 20, 30, 40. Each mean is based on 240 decision episodes. Error bars are 95 percent within-archive stratified percentile bootstrap intervals with 2000 resamples. Knowledge Gradient has the lowest mean regret at every budget.</desc>
