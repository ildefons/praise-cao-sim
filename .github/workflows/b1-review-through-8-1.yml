name: Build default-pdfLaTeX B1 reviewed-through-8.1 Overleaf ZIP

on:
  push:
    branches: [praise-identifiability-feasibility]
    paths:
      - .github/workflows/b1-review-through-8-1.yml
      - first_science/b1/report/build_review_snapshot_v1.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: praise-identifiability-feasibility
          fetch-depth: 0

      - name: Install default pdfLaTeX toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-pictures \
            texlive-fonts-recommended texlive-plain-generic \
            latexmk zip poppler-utils lmodern

      - name: Build and verify review-only snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 first_science/b1/report/build_review_snapshot_v1.py
          ls -lh first_science/b1/report/review_snapshot/
          unzip -tqq first_science/b1/report/review_snapshot/B1_REVIEW_THROUGH_8_1_OVERLEAF.zip

      - name: Upload PDF and Overleaf ZIP
        uses: actions/upload-artifact@v4
        with:
          name: B1-reviewed-through-8-1-Overleaf
          path: |
            first_science/b1/report/review_snapshot/B1_REVIEW_THROUGH_8_1_OVERLEAF.zip
            first_science/b1/report/review_snapshot/B1_REVIEW_THROUGH_8_1.pdf
          if-no-files-found: error
          retention-days: 90

      - name: Publish snapshot to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/${GITHUB_REF_NAME}")" ]; then
            echo "::notice::A newer source commit exists; do not publish a stale snapshot."
            exit 0
          fi
          git add first_science/b1/report/review_snapshot/B1_REVIEW_THROUGH_8_1_OVERLEAF.zip \
                  first_science/b1/report/review_snapshot/B1_REVIEW_THROUGH_8_1.pdf
          if ! git diff --staged --quiet; then
            git commit -m "Publish B1 reviewed-through-8.1 PDF and Overleaf ZIP"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
