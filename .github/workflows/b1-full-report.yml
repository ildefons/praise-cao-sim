name: Build full B1 technical report PDF and Overleaf ZIP

on:
  push:
    branches: [praise-identifiability-feasibility]
    paths:
      - .github/workflows/b1-full-report.yml
      - first_science/b1/report/overleaf/main.tex
      - first_science/b1/report/overleaf/README.md
      - first_science/b1/report/overleaf/figures/**
      - first_science/b1/report/rebuild_b1_pdf_local.sh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-full-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: praise-identifiability-feasibility
          fetch-depth: 0

      - name: Install standard pdfLaTeX and PDF verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-pictures \
            texlive-fonts-recommended texlive-plain-generic lmodern \
            latexmk zip unzip poppler-utils

      - name: Configure report artifact publisher
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compile, verify, package and publish full report
        shell: bash
        run: |
          set -euo pipefail
          bash first_science/b1/report/rebuild_b1_pdf_local.sh

      - name: Upload full report deliverables
        uses: actions/upload-artifact@v4
        with:
          name: B1-full-report-PDF-and-Overleaf
          path: |
            first_science/b1/report/B1_TECHNICAL_REPORT_DRAFT_V0_1.pdf
            first_science/b1/report/B1_OVERLEAF_PROJECT_V0_1.zip
          if-no-files-found: error
          retention-days: 90
