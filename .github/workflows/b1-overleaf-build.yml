name: Build B1 Overleaf project and rendered PDF

on:
  push:
    branches: [praise-identifiability-feasibility]
    paths:
      - .github/workflows/b1-overleaf-build.yml
      - first_science/b1/report/overleaf/main.tex
      - first_science/b1/report/overleaf/figures/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout B1 report branch
        uses: actions/checkout@v4

      - name: Install XeLaTeX toolchain
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-pictures \
            texlive-fonts-recommended texlive-plain-generic \
            latexmk zip poppler-utils

      - name: Compile existing LaTeX Overleaf source
        shell: bash
        run: |
          set -euo pipefail
          cd first_science/b1/report/overleaf
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex
          test -s main.pdf
          pdfinfo main.pdf | grep -E 'Pages:|Page size:'
          mkdir -p ../
          cp main.pdf ../B1_TECHNICAL_REPORT_DRAFT_V0_1.pdf
          zip -9 -r ../B1_OVERLEAF_PROJECT_V0_1.zip main.tex README.md figures
          test -s ../B1_OVERLEAF_PROJECT_V0_1.zip

      - name: Upload completed PDF and Overleaf ZIP
        uses: actions/upload-artifact@v4
        with:
          name: B1-Overleaf-and-rendered-PDF
          path: |
            first_science/b1/report/B1_OVERLEAF_PROJECT_V0_1.zip
            first_science/b1/report/B1_TECHNICAL_REPORT_DRAFT_V0_1.pdf
          if-no-files-found: error
          retention-days: 90

      - name: Keep compiled deliverables with project source
        shell: bash
        run: |
          set -euo pipefail
          cd first_science/b1/report
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add B1_OVERLEAF_PROJECT_V0_1.zip B1_TECHNICAL_REPORT_DRAFT_V0_1.pdf
          if ! git diff --staged --quiet; then
            git commit -m "Publish compiled B1 Overleaf ZIP and report PDF"
            git push
          fi
